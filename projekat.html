<!DOCTYPE html>
<html lang='en'>
<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewpport" content="width=device-width, initial-scale=1.0"/>
 <link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
 />
 
<title>Projekat-NS</title>
<style>
      html, body {
        height: 100%;
        padding: 0;
        margin: 0;
      }
      #map {
        /* configure the size of the map */
        width: 60%;
        height: 60%;
      }
    </style>
</head>
<body>
<div id="map"></div>
</body>
</html>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<script> 
var map = L.map('map').setView({lat: 45.259103, lon:19.848464 }, 12);

//add the OpenStreetMap tiles
L.tileLayer('https://server.arcgisonline.com/ArcGis/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
}).addTo(map);


// show the scale bar on the lower left corner
 L.control.scale({imperial: true, metric: true}).addTo(map); 

var popup = L.popup();
function onMapClick(e) {
 popup
 .setLatLng(e.latlng)
 .setContent("Tvoja pozicija: " + e.latlng.toString())
 .openOn(map);
}
map.on('click', onMapClick);

        
var PostGisSloj =L.tileLayer.wms('http://localhost:8080/geoserver/wms?', {
	layers: 'marijana:water_parameterized',
  transparent: true,
  format: 'image/png',
  viewparams: 'tip:riverbank'

});
var RasterSloj =L.tileLayer.wms('http://localhost:8080/geoserver/wms?', {
	layers: 'marijana:Novi Sad 2',
  transparent: true,
  format: 'image/png' 
});
var VektorSloj =L.tileLayer.wms('http://localhost:8080/geoserver/wms?', {
	layers: 'marijana:novi_sad_putevi',
  transparent: true,
  format: 'image/png' 
});

L.control.layers(null, {PostGisSloj}).addTo(map);
L.control.layers(null, {VektorSloj}).addTo(map);
L.control.layers(null, {RasterSloj}).addTo(map);






</script>
